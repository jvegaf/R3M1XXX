name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install PlatformIO
        run: pip install platformio
        
      - name: Build firmware
        run: pio run
        
      - name: Run tests
        run: pio test --environment native
        
      - name: Check code formatting (optional)
        run: |
          if [ -f "clang-format" ] || command -v clang-format >/dev/null 2>&1; then
            find src include -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
          else
            echo "clang-format not available, skipping format check"
          fi
        continue-on-error: true